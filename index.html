<!doctype html>
<html lang="pl">

    <meta name="theme-color" content="#0b0b10" />
    <meta name="description" content="sqezen — developer, gamer, digital chaos." />
    <title>sqezen — profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <main class="profile-shell">
      <section class="profile-card" aria-labelledby="profile-name">
        <img

          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 104 104'%3E%3Crect width='104' height='104' rx='52' fill='%23212631'/%3E%3Ctext x='52' y='64' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='%23f5f7fb'%3Es%3C/text%3E%3C/svg%3E"
          alt="Avatar użytkownika sqezen"
          width="104"
          height="104"
        />

        <h1 id="profile-name">sqezen</h1>
        <p class="tagline">developer <span aria-hidden="true">•</span> gamer <span aria-hidden="true">•</span> digital chaos</p>

        <nav class="social-links" aria-label="Linki społecznościowe">
          <a class="social-btn" href="https://github.com/" target="_blank" rel="noopener noreferrer">

            <span>GitHub</span><span class="external" aria-hidden="true">↗</span>
          </a>
          <a class="social-btn" href="https://discord.com/" target="_blank" rel="noopener noreferrer">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.54 5.33A16.24 16.24 0 0 0 15.5 4l-.5 1.03a14.3 14.3 0 0 0-6 0L8.5 4a16.3 16.3 0 0 0-4.04 1.33C1.9 9.32 1.2 13.21 1.55 17.04A16.4 16.4 0 0 0 6.5 19.5l1.2-1.62a10 10 0 0 1-1.78-.85l.44-.34c3.45 1.6 7.19 1.6 10.6 0l.46.34c-.57.34-1.17.62-1.8.85l1.2 1.62a16.4 16.4 0 0 0 4.95-2.46c.42-4.43-.72-8.28-2.23-11.71ZM8.35 14.82c-1.03 0-1.88-.95-1.88-2.1s.83-2.1 1.88-2.1c1.06 0 1.9.95 1.88 2.1 0 1.15-.83 2.1-1.88 2.1Zm7.3 0c-1.03 0-1.88-.95-1.88-2.1s.83-2.1 1.88-2.1c1.06 0 1.9.95 1.88 2.1 0 1.15-.83 2.1-1.88 2.1Z"/></svg>
            <span>Discord</span><span class="external" aria-hidden="true">↗</span>
          </a>
          <a class="social-btn" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.13C19.55 3.55 12 3.55 12 3.55s-7.55 0-9.4.52A3 3 0 0 0 .5 6.2 31.2 31.2 0 0 0 0 12a31.2 31.2 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.13c1.85.52 9.4.52 9.4.52s7.55 0 9.4-.52a3 3 0 0 0 2.1-2.13A31.2 31.2 0 0 0 24 12a31.2 31.2 0 0 0-.5-5.8ZM9.55 15.6V8.4L15.8 12l-6.25 3.6Z"/></svg>
            <span>YouTube</span><span class="external" aria-hidden="true">↗</span>
          </a>
          <a class="social-btn" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">

            <span>TikTok</span><span class="external" aria-hidden="true">↗</span>
          </a>
        </nav>

        <section class="about" aria-labelledby="about-title">
          <p class="section-label" id="about-title">ABOUT</p>
          <p class="about-copy">Buduję rzeczy, gram po nocach i próbuję nie zepsuć produkcji. Zwykle wychodzi różnie.</p>
        </section>

        <footer class="profile-footer">
          <span>sqezen.lol</span>
          <span>made with sqezen</span>
        </footer>
      </section>
    </main>

    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const redirectedPath = params.get("redirect");
        if (redirectedPath) {
          history.replaceState(null, "", redirectedPath);
        }

        const path = window.location.pathname.replace(/\/+$/, "") || "/";
        if (path === "/") return;

        const card = document.querySelector(".profile-card");
        if (!card) return;

        const safeName = path.slice(1).split("/")[0].replace(/[^a-zA-Z0-9_-]/g, "") || "sqezen";
        const isDashboard = path === "/dashboard";
        const isLogin = path === "/login";
        document.title = isDashboard ? "Dashboard — sqezen" : isLogin ? "Logowanie — sqezen" : `${safeName} — sqezen`;

        if (isDashboard || isLogin) {
          card.innerHTML = `
            <p class="section-label">SQEZEN / ${isDashboard ? "DASHBOARD" : "ACCOUNT"}</p>
            <h1>${isDashboard ? "Panel twórcy" : "Zaloguj się"}</h1>
            <p class="about-copy">${isDashboard ? "Zaloguj się, aby edytować swój profil, linki i ustawienia." : "Zaloguj się, aby przejść do swojego panelu."}</p>
            <a class="social-btn route-btn" href="${isDashboard ? "/login" : "/dashboard"}">${isDashboard ? "Przejdź do logowania" : "Przejdź do dashboardu"}<span class="external" aria-hidden="true">↗</span></a>
            <a class="route-back" href="/">← Wróć na profil sqezen</a>
          `;
          return;
        }

        card.querySelector("#profile-name").textContent = safeName;
        card.querySelector(".about-copy").textContent = "Ten profil jest dostępny publicznie na sqezen.lol.";
        card.querySelector(".profile-footer span").textContent = `sqezen.lol/${safeName}`;
      })();
    </script>
  </body>
</html>
