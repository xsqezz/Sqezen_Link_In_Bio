<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="description" content="sqezen — developer, gamer, digital chaos." />
    <title>sqezen — profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <main class="profile-shell">
      <section class="profile-card" aria-labelledby="profile-name">
        <div class="home-grid">
          <div class="home-intro">
            <p class="section-label">SQEZEN / YOUR SPACE ONLINE</p>
            <h1 id="profile-name">Twoje linki.<br /><span>Twoje miejsce.</span></h1>
            <p class="tagline">Minimalistyczna bio-page dla twórców, developerów i graczy.</p>
            <p class="about-copy">Zbierz wszystkie ważne linki w jednym spokojnym, szybkim profilu pod własną nazwą na <strong>sqezen.lol</strong>.</p>
          </div>

          <form class="login-form" id="login-form">
            <p class="section-label">ZALOGUJ SIĘ</p>
            <label for="login-email">E-mail</label>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="ty@example.com" required />
            <label for="login-password">Hasło</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
            <button class="social-btn route-btn" type="submit">Zaloguj się <span class="external" aria-hidden="true">↗</span></button>
            <p class="form-feedback" id="login-feedback" role="status"></p>
            <p class="form-note">Nie masz konta? <a href="/register">Utwórz je</a></p>
          </form>
        </div>

        <footer class="profile-footer">
          <span>sqezen.lol</span>
          <span>profiles for people who build</span>
        </footer>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const redirectedPath = params.get("redirect");
        if (redirectedPath) {
          history.replaceState(null, "", redirectedPath);
        }

        const path = window.location.pathname.replace(/\/+$/, "") || "/";
        if (path === "/") return;

        const card = document.querySelector(".profile-card");
        if (!card) return;

        const safeName = path.slice(1).split("/")[0].replace(/[^a-zA-Z0-9_-]/g, "") || "sqezen";
        const isDashboard = path === "/dashboard";
        const isLogin = path === "/login";
        document.title = isDashboard ? "Dashboard — sqezen" : isLogin ? "Logowanie — sqezen" : `${safeName} — sqezen`;

        if (isDashboard || isLogin || path === "/register") {
          card.innerHTML = `
            <p class="section-label">SQEZEN / ${isDashboard ? "DASHBOARD" : "ACCOUNT"}</p>
            <h1>${isDashboard ? "Panel twórcy" : path === "/register" ? "Utwórz konto" : "Zaloguj się"}</h1>
            <p class="about-copy">${isDashboard ? "Zaloguj się, aby edytować swój profil, linki i ustawienia." : path === "/register" ? "Załóż konto, a potem wybierz własną nazwę profilu." : "Zaloguj się, aby przejść do swojego panelu."}</p>
            <a class="social-btn route-btn" href="${isDashboard ? "/login" : path === "/register" ? "/" : "/dashboard"}">${isDashboard ? "Przejdź do logowania" : path === "/register" ? "Wróć do logowania" : "Przejdź do dashboardu"}<span class="external" aria-hidden="true">↗</span></a>
            <a class="route-back" href="/">← Wróć na profil sqezen</a>
          `;
          return;
        }

        card.innerHTML = `
          <img class="avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 104 104'%3E%3Crect width='104' height='104' rx='52' fill='%23212631'/%3E%3Ctext x='52' y='64' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='%23f5f7fb'%3E${safeName[0].toUpperCase()}%3C/text%3E%3C/svg%3E" alt="Avatar użytkownika ${safeName}" width="104" height="104" />
          <h1 id="profile-name">${safeName}</h1>
          <p class="tagline">developer <span aria-hidden="true">•</span> gamer <span aria-hidden="true">•</span> digital chaos</p>
          <nav class="social-links" aria-label="Linki społecznościowe">
            <a class="social-btn" href="/" >Wróć do sqezen <span class="external" aria-hidden="true">↗</span></a>
          </nav>
          <section class="about" aria-labelledby="about-title"><p class="section-label" id="about-title">ABOUT</p><p class="about-copy">Ten profil jest dostępny publicznie na sqezen.lol.</p></section>
          <footer class="profile-footer"><span>sqezen.lol/${safeName}</span><span>made with sqezen</span></footer>
        `;
      })();
    </script>
    <script>
      const loginForm = document.querySelector("#login-form");
      if (loginForm && window.supabase) {
        const client = window.supabase.createClient("https://wzdxgmzwxzfhegelqugy.supabase.co", "sb_publishable_63IpIFewxY0qJ3Cx532LQA_vEwXoSwP");
        loginForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const feedback = document.querySelector("#login-feedback");
          feedback.textContent = "Logowanie...";
          const form = new FormData(loginForm);
          const { error } = await client.auth.signInWithPassword({ email: form.get("email"), password: form.get("password") });
          if (error) { feedback.textContent = "Nieprawidłowy e-mail lub hasło."; return; }
          window.location.href = "/dashboard";
        });
      }
    </script>
  </body>
</html>
