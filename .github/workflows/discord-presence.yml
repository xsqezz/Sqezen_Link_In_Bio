name: Discord presence sync

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: discord-presence-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - name: Check out the bot
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: discord-presence-bot/package-lock.json

      - name: Install dependencies
        working-directory: discord-presence-bot
        run: npm ci --no-audit --no-fund

      - name: Run presence sync
        working-directory: discord-presence-bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SUPABASE_URL: https://wzdxgmzwxzfhegelqugy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Set DISCORD_BOT_TOKEN and SUPABASE_SERVICE_ROLE_KEY repository secrets to enable presence sync."
            exit 0
          fi
          set +e
          timeout --signal=TERM --kill-after=30s 4h50m npm start
          status=$?
          if [ "$status" -eq 124 ]; then
            exit 0
          fi
          exit "$status"
